# Render Blueprint — deploys the Stowage web app as a free web service.
# Render reads this automatically when you create a Blueprint from the repo.
services:
  - type: web
    name: stowage
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements-web.txt"
    startCommand: "gunicorn webapp.app:app -c gunicorn.conf.py"
    # /healthz renders no template and does no packing, so Render's probe (and
    # any keep-warm ping) costs almost nothing.
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # The free plan grants a fraction of a core, so one worker per reported
      # core would only make them contend. Raise this with the instance size.
      - key: WEB_CONCURRENCY
        value: "2"
      # Render terminates TLS and forwards one hop; without this every client
      # shares the proxy's address and so a single rate-limit bucket.
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Seconds of search per request. Lower it if the free plan's CPU share
      # makes packs feel slow; the answer degrades gracefully.
      - key: PACK_TIME_BUDGET_S
        value: "5"
